[package]
name = "saasmith"
version = "0.1.0"
description = "SaaSMith - SaaS development harness"
authors = ["cristpinheiro"]
edition = "2021"

[lib]
name = "saasmith_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "saasmith"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"

[package.metadata.bundle]
identifier = "com.saasmith.app"
